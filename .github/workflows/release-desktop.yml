name: Release desktop app

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-main
  cancel-in-progress: false

env:
  UPDATE_FEED_URL: https://github.com/blntrsz/Fission/releases/latest/download/appcast.xml

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Verify update-signing secrets
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: |
          : "${SPARKLE_PRIVATE_KEY:?Missing SPARKLE_PRIVATE_KEY}"
          : "${SPARKLE_PUBLIC_KEY:?Missing SPARKLE_PUBLIC_KEY}"

      - name: Verify macOS 26 SDK
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $sdk_version"
          test "${sdk_version%%.*}" -ge 26

      - name: Build ad-hoc signed DMG
        env:
          FISSION_BUILD_NUMBER: ${{ github.run_number }}
          FISSION_MARKETING_VERSION: 0.1.${{ github.run_number }}
          FISSION_UPDATE_FEED_URL: ${{ env.UPDATE_FEED_URL }}
          FISSION_SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: ./scripts/package-desktop.sh

      - name: Sign update and generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_TAG: desktop-${{ github.run_number }}
        run: |
          signing_key="$RUNNER_TEMP/sparkle-private-key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$signing_key"
          chmod 600 "$signing_key"
          sign_update="$(find Apps/Desktop/.derivedData/SourcePackages/artifacts -type f -name sign_update -perm -111 | head -1)"
          test -n "$sign_update"
          "$sign_update" -f "$signing_key" dist/Fission.dmg > dist/sign_update.txt
          rm -f "$signing_key"
          python3 scripts/generate-appcast.py \
            --signature dist/sign_update.txt \
            --output dist/appcast.xml \
            --build "${{ github.run_number }}" \
            --version "0.1.${{ github.run_number }}" \
            --commit "$GITHUB_SHA" \
            --tag "$RELEASE_TAG"
          shasum -a 256 dist/Fission.dmg > dist/Fission.dmg.sha256
          python3 -c 'import xml.etree.ElementTree as ET; ET.parse("dist/appcast.xml")'

      - name: Stage immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: desktop-${{ github.run_number }}
        run: |
          title="Fission Desktop 0.1.${{ github.run_number }}"
          notes="Automated ad-hoc signed desktop build of commit ${GITHUB_SHA}. This build is not notarized; macOS may require users to approve its first launch in Privacy & Security."

          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
            gh release upload "$RELEASE_TAG" \
              dist/Fission.dmg \
              dist/Fission.dmg.sha256 \
              dist/appcast.xml \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/Fission.dmg \
              dist/Fission.dmg.sha256 \
              dist/appcast.xml \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --draft
          fi

      - name: Verify staged assets and publish update feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: desktop-${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          assets = json.loads(subprocess.check_output([
              "gh", "release", "view", os.environ["RELEASE_TAG"],
              "--json", "assets", "--jq", ".assets",
          ]))
          remote = {asset["name"]: asset["size"] for asset in assets}
          for path in ("dist/Fission.dmg", "dist/Fission.dmg.sha256", "dist/appcast.xml"):
              name = os.path.basename(path)
              assert remote.get(name) == os.path.getsize(path), (name, remote.get(name), os.path.getsize(path))
          PY
          gh release edit "$RELEASE_TAG" --draft=false --latest
