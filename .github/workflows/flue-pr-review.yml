name: Flue PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: flue-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive

      - name: Show review in progress
        run: |
          cat > "$RUNNER_TEMP/flue-comment.md" <<EOF
          <!-- flue-review-sha:${HEAD_SHA} -->
          ## Flue code review

          ⏳ Reviewing commit \`${HEAD_SHA:0:7}\`…
          EOF
          node .github/scripts/upsert-flue-review-comment.mjs "$RUNNER_TEMP/flue-comment.md"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: flue/package-lock.json

      - name: Install Flue agent
        run: npm ci --prefix flue

      - name: Run code review
        id: review
        working-directory: flue
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          npx flue run src/agents/pr-review.ts \
            --message "Review PR #${PR_NUMBER} with fixed point ${BASE_SHA}." \
            --json > response.json
          jq -er '.message | strings | select(length > 0)' response.json > review.md

      - name: Publish terminal review state
        if: ${{ always() }}
        env:
          EXPECTED_BODY_TOKEN: ${{ github.event.pull_request.head.sha }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$REVIEW_OUTCOME" == "success" ]]; then
            {
              printf '<!-- flue-review-sha:%s -->\n## Flue code review\n\n✅ Reviewed commit `%s`.\n\n' \
                "$HEAD_SHA" "${HEAD_SHA:0:7}"
              sed \
                -e '/<!-- flue-pr-review -->/d' \
                -e '/^## Flue code review$/d' \
                -e '/^✅ Reviewed commit `.*`\.$/d' \
                -e '/^⏳ Reviewing commit /d' \
                flue/review.md
            } > "$RUNNER_TEMP/flue-comment.md"
          elif [[ "$REVIEW_OUTCOME" == "cancelled" ]]; then
            printf '<!-- flue-review-sha:%s -->\n## Flue code review\n\n⏭️ Review of commit `%s` was superseded by a newer run.\n' \
              "$HEAD_SHA" "${HEAD_SHA:0:7}" > "$RUNNER_TEMP/flue-comment.md"
          else
            printf '<!-- flue-review-sha:%s -->\n## Flue code review\n\n❌ Review failed. [Open the workflow run](%s) for details.\n' \
              "$HEAD_SHA" "$RUN_URL" > "$RUNNER_TEMP/flue-comment.md"
          fi
          node .github/scripts/upsert-flue-review-comment.mjs "$RUNNER_TEMP/flue-comment.md"
